name: Render Remotion Video

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm install

      - name: Install Remotion Browser
        run: npx remotion browser ensure

      - name: Render Video
        run: |
          mkdir -p out
          npx remotion render src/index.ts HelloWorld out/video.mp4

      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: remotion-video
          path: out/video.mp4
          if-no-files-found: error
          retention-days: 7
